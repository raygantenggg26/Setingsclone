name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile Swift Code & Create App Bundle
        run: |
          mkdir -p build/SettingsClone.app

          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-executable \
                 -o build/SettingsClone.app/SettingsClone \
                 Sources/main.swift

          if [ -f "Info.plist" ]; then
            cp Info.plist build/SettingsClone.app/Info.plist
          fi

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/SettingsClone.app build/Payload/
          cd build
          zip -r SettingsClone.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SettingsClone-IPA
          path: build/SettingsClone.ipa
